<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLLI CHANT</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:#fff9fc;color:#2d2838}.loading{font-weight:800}</style></head><body><div class="loading">PLLI CHANT 불러오는 중…</div><script>(async()=>{try{const names=['data_00.txt','data_01.txt','data_02.txt','data_03.txt'];const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const b=parts.join('').trim();const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:30px;font-family:system-ui">페이지를 불러오지 못했어요.<br>새로고침해 주세요.</div>';console.error(e)}})();</script></body></html>

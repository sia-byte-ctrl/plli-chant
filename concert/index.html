<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAVE INCHEON PLANNER</title></head>
<body style="font-family:system-ui,sans-serif;padding:24px">플래너 불러오는 중…<script>
(async()=>{
  const files=['chunk0.txt','chunk1.txt','chunk2.txt','chunk3.txt','chunk4.txt','chunk5.txt','chunk6.txt'];
  const parts=await Promise.all(files.map(f=>fetch(f+'?v=20260828-1005',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));
  let html=parts.join('');

  html=html.replace(
    '<section id="checkView" class="hidden">\n    <div class="section-head"><div><h2>체크리스트</h2><p>체크 상태도 자동 저장</p></div></div>\n    <div class="checkgrid" id="checkgrid"></div>\n  </section>',
    '<section id="checkView" class="hidden">\n    <div class="section-head">\n      <div><h2>체크리스트</h2><p>준비물 추가 · 체크 상태 모두 공용 자동 저장</p></div>\n      <div class="check-head-actions"><button class="btn primary" type="button" onclick="openSupplyEditor()">＋ 준비물 추가</button></div>\n    </div>\n    <div class="checkgrid" id="checkgrid"></div>\n  </section>'
  );

  html=html.replace('</head>','<style>.check-head-actions{display:flex;align-items:center;gap:8px}.checkitem input{flex:none}.checkitem .checktext{flex:1;min-width:0;word-break:break-word}.checkdelete{flex:none;border:0;background:transparent;color:#a2a9b8;width:26px;height:26px;border-radius:8px;padding:0;font-size:15px;font-weight:800}.checkdelete:hover{background:#fff0f2;color:#c92b38}</style></head>');

  const supplyDialog='<dialog id="supplyDialog"><div class="modal"><h3>준비물 추가</h3><div class="formgrid"><label>분류<select id="supplyCategory"></select></label><label class="full">준비물<input id="supplyName" placeholder="예: 우비, 슬로건, 여분 렌즈"></label></div><div class="modalactions"><button class="btn" type="button" onclick="supplyDialog.close()">취소</button><button class="btn red" type="button" onclick="addSupply()">추가</button></div></div></dialog>';
  const supplyScript='<script src="supplies.js?v=20260828-1005"></'+'script>';
  html=html.replace('</body>',supplyDialog+supplyScript+'</body>');

  document.open();
  document.write(html);
  document.close();
})().catch(e=>{document.body.innerHTML='<p>플래너를 불러오지 못했어. 새로고침해줘.</p>';console.error(e)});
</script></body></html>
